name: Wiki New Aesthetics Monitor

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday at 9:00 UTC
  workflow_dispatch:        # allow manual run anytime
    inputs:
      since:
        description: 'Re-scan pages created since this date (YYYY-MM-DD). Leave empty to continue from the last successful run.'
        required: false

concurrency:
  group: wiki-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # read previous runs; keep the schedule enabled
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5

      - name: Update the review issue with new wiki pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        run: python3 .github/scripts/wiki_monitor.py

      # Scheduled workflows are switched off after 60 days without repository
      # activity; re-enabling the workflow on every run keeps it alive.
      - name: Keep the weekly schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wiki-monitor.yml/enable"
